# =============================================================================
# VedaDB Configuration File (vedadb.conf)
# =============================================================================
# VedaDB: The World's First Truly Unified Multi-Model Database
# One Engine. Seven Data Models. Zero Fragmentation.
#
# This is the main configuration file for VedaDB.
# It controls everything: which data models to enable, clustering, sharding,
# security, replication, performance tuning, and more.
#
# Location: /etc/vedadb/vedadb.conf
# Reload:   sudo systemctl reload vedadb     (hot-reloadable settings)
# Restart:  sudo systemctl restart vedadb    (all settings take effect)
#
# Format: YAML (like MongoDB's mongod.conf)
# =============================================================================


# =============================================================================
# CORE - Data Models (Enable/Disable individual engines)
# =============================================================================
# Set 'enabled: false' to completely disable a data model.
# Disabling a model saves memory and CPU.
# Restart required for changes to take effect.

data_models:
  # SQL Engine - Relational queries, JOINs, GROUP BY, aggregates
  sql:
    enabled: true
    query_cache: true
    query_cache_size_mb: 64
    # max_connections: Maximum concurrent SQL connections
    max_connections: 1000
    # default_storage_engine: btree | hash | lsm
    default_storage_engine: btree

  # Vector Engine - High-dimensional similarity search
  vector:
    enabled: true
    # supported_metrics: cosine, euclidean, dot, manhattan, hamming
    default_metric: cosine
    # dimension_limit: Maximum vector dimension allowed
    dimension_limit: 1536
    # index_type: hnsw | ivf | flat | pq
    index_type: hnsw
    # ef_construction: HNSW build-time quality (higher = better, slower)
    ef_construction: 200
    # ef_search: HNSW search-time quality (higher = better, slower)
    ef_search: 64
    # max_vectors_per_collection
    max_vectors_per_collection: 10000000

  # Graph Engine - Traversal, BFS, shortest path, PageRank
  graph:
    enabled: true
    # traversal_depth_limit: Max depth for graph traversal queries
    traversal_depth_limit: 100
    # enable_pagerank: Enable PageRank algorithm
    enable_pagerank: true
    # pagerank_iterations
    pagerank_iterations: 50
    # max_edges_per_node
    max_edges_per_node: 100000
    # index_type: adjacency_list | csr
    index_type: adjacency_list

  # Document Engine - JSON storage with indexing
  document:
    enabled: true
    # max_document_size_mb: Maximum document size
    max_document_size_mb: 16
    # indexing: all | partial | manual
    indexing: all
    # text_search: Enable full-text search on document fields
    text_search: true

  # Cache Engine - In-memory key-value with TTL
  cache:
    enabled: true
    # max_memory_mb: Maximum memory for cache layer
    max_memory_mb: 512
    # eviction_policy: lru | lfu | ttl | random | noeviction
    eviction_policy: lru
    # default_ttl_seconds: Default TTL for cached keys (0 = no expiry)
    default_ttl_seconds: 3600
    # max_key_length: Maximum key length in bytes
    max_key_length: 512
    # max_value_size_mb: Maximum value size
    max_value_size_mb: 512
    # enable_pubsub: Enable publish/subscribe messaging
    enable_pubsub: true

  # Search Engine - Full-text indexing and search
  search:
    enabled: true
    # index_analyzer: standard | whitespace | simple | keyword | custom
    index_analyzer: standard
    # max_results_per_query
    max_results_per_query: 10000
    # highlight_enabled: Enable search result highlighting
    highlight_enabled: true
    # fuzzy_search: Enable fuzzy matching (typo tolerance)
    fuzzy_search: true
    # fuzzy_max_distance: Maximum edit distance for fuzzy matching
    fuzzy_max_distance: 2

  # Time Series Engine - Timestamped data with rollups
  time_series:
    enabled: true
    # retention_days: Default data retention period
    retention_days: 365
    # enable_rollup: Automatic aggregation of old data
    enable_rollup: true
    # rollup_intervals: "1h:7d, 1d:30d, 7d:90d, 30d:1y"
    rollup_intervals: "1h:7d,1d:30d,7d:90d,30d:1y"
    # max_datapoints_per_series
    max_datapoints_per_series: 10000000
    # compression: Enable time-series data compression
    compression: true


# =============================================================================
# NETWORK - How VedaDB listens for connections
# =============================================================================
# Hot-reloadable: No (requires restart)

net:
  # REST API port (HTTP)
  http_port: 8080
  # TCP Wire Protocol port (binary protocol, like Redis)
  tcp_port: 6380
  # WebSocket port (real-time subscriptions)
  websocket_port: 8081
  # Studio/Workbench port (admin UI)
  studio_port: 9090

  # Bind IP addresses (comma-separated)
  # 127.0.0.1 = localhost only
  # 0.0.0.0   = all interfaces
  # ::          = all IPv6 interfaces
  bind_ip: "127.0.0.1"

  # Max concurrent connections across all protocols
  max_connections: 5000

  # Connection timeout in seconds
  connection_timeout: 300

  # TCP keepalive
  tcp_keepalive: true

  # Enable HTTP/2 for REST API
  http2: true

  # CORS - Cross-Origin Resource Sharing
  # Set to true to allow all origins (NOT recommended for production)
  cors_allow_all: false
  # Specific allowed origins (if cors_allow_all is false)
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
  # Allowed HTTP methods for CORS
  cors_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
    - "PATCH"


# =============================================================================
# SECURITY - Authentication, Authorization, TLS/SSL
# =============================================================================
# Hot-reloadable: Some (auth), No (TLS requires restart)

security:
  # Authentication: Enable/disable login requirement
  # enabled = all requests need API key or JWT token
  # disabled = no authentication (DANGEROUS in production)
  authentication:
    enabled: true
    # auth_method: jwt | apikey | basic | oauth2
    primary_method: jwt
    # jwt_secret: Secret key for JWT signing (change in production!)
    jwt_secret: "CHANGE_THIS_SECRET_IN_PRODUCTION"
    # jwt_expiry_hours: Token expiry time
    jwt_expiry_hours: 24
    # password_hash: argon2id | bcrypt | scrypt
    password_hash: argon2id
    # max_login_attempts: Lock account after N failed attempts
    max_login_attempts: 5
    # lockout_duration_minutes: How long to lock account
    lockout_duration_minutes: 30

  # Authorization (RBAC - Role-Based Access Control)
  authorization:
    enabled: true
    # default_role: Role for new users
    default_role: "reader"
    # roles: reader, writer, admin, superadmin
    # Permissions can be set per-database, per-collection, per-table

  # TLS/SSL - Encrypt all network traffic
  tls:
    enabled: false
    # Mode: disabled | allow | prefer | require
    mode: require
    # Path to certificate + key file (PEM format)
    certificate_key_file: "/etc/vedadb/ssl/vedadb.pem"
    # Path to CA certificate for client verification
    ca_file: "/etc/vedadb/ssl/ca.pem"
    # minimum_tls_version: "1.2" | "1.3"
    minimum_tls_version: "1.2"

  # Rate Limiting - Prevent abuse
  rate_limiting:
    enabled: true
    # requests_per_minute: Max requests per IP per minute
    requests_per_minute: 1000
    # burst: Allow short bursts above the limit
    burst: 50
    # exceeded_action: delay | drop | blacklist
    exceeded_action: delay

  # SQL Injection Prevention
  sql_injection_protection: true

  # IP Whitelist/Blacklist
  ip_filter:
    enabled: false
    # whitelist: Only allow these IPs
    whitelist: []
    # blacklist: Block these IPs
    blacklist: []


# =============================================================================
# CLUSTERING - High Availability with Raft Consensus
# =============================================================================
# Enable clustering for fault tolerance and scalability.
# Requires restart to enable/disable.

cluster:
  # enabled: Set to true to join/create a cluster
  enabled: false

  # cluster_name: Unique name for this cluster
  cluster_name: "vedadb-cluster-1"

  # node_id: Unique identifier for this node (auto-generated if empty)
  node_id: ""

  # node_name: Human-readable node name
  node_name: "node-1"

  # bind_address: IP other nodes use to connect to this node
  bind_address: "0.0.0.0"

  # cluster_port: Port for inter-node communication
  cluster_port: 16380

  # discovery: How nodes find each other
  #   static    - Manually specify seed_nodes
  #   gossip    - Automatic discovery via gossip protocol
  #   dns       - DNS-based discovery
  discovery:
    method: static
    # For static discovery, list all seed nodes
    seed_nodes:
      - "192.168.1.10:16380"
      - "192.168.1.11:16380"
      - "192.168.1.12:16380"
    # For gossip discovery
    gossip_port: 16381
    # For DNS discovery
    dns_record: "vedadb-cluster.internal"

  # replication_factor: How many copies of each data shard
  replication_factor: 3

  # minimum_nodes: Minimum nodes required for cluster to be healthy
  minimum_nodes: 3

  # auto_failover: Automatically promote replica if primary fails
  auto_failover: true

  # failover_timeout_seconds: How long to wait before triggering failover
  failover_timeout_seconds: 10

  # read_preference: Where read queries go
  #   primary     - Only primary node
  #   primaryPreferred - Primary if available, else replica
  #   secondary   - Any replica
  #   nearest     - Nearest node (lowest latency)
  read_preference: primaryPreferred

  # write_concern: How many nodes must acknowledge a write
  #   1      = Primary only
  #   2+     = Primary + N replicas
  #   all    = All nodes
  write_concern: 2


# =============================================================================
# SHARDING - Horizontal Data Distribution
# =============================================================================
# Shard large datasets across multiple nodes for scalability.
# Requires clustering to be enabled.

sharding:
  # enabled: Enable/disable sharding
  enabled: false

  # shard_count: Number of shards (auto-detected from cluster if 0)
  shard_count: 0

  # auto_sharding: Automatically shard large collections
  auto_sharding: true

  # auto_shard_threshold_mb: Collections larger than this get auto-sharded
  auto_shard_threshold_mb: 1024

  # shard_strategy: hash | range | tag
  #   hash  = Distribute evenly across shards
  #   range = Shard by value range
  #   tag   = Manual shard assignment
  default_strategy: hash

  # chunk_size_mb: Size of each shard chunk before splitting
  chunk_size_mb: 64

  # balancer: Automatically move chunks between shards for even distribution
  balancer:
    enabled: true
    # run_interval_minutes: How often to check and rebalance
    run_interval_minutes: 60
    # threshold_percent: Rebalance if shard size differs by more than this
    threshold_percent: 10

  # Per-collection shard configuration (examples)
  collections:
    # Example: Shard 'users' collection by 'country' field
    # - name: "users"
    #   shard_key: "country"
    #   strategy: "hash"
    # Example: Shard 'events' time-series collection by timestamp
    # - name: "events"
    #   shard_key: "timestamp"
    #   strategy: "range"


# =============================================================================
# STORAGE - Where and how data is stored on disk
# =============================================================================
# Restart required for changes to take effect.

storage:
  # data_dir: Directory for database files
  data_dir: "/var/lib/vedadb/data"

  # journal_dir: Directory for write-ahead logs (WAL)
  journal_dir: "/var/lib/vedadb/journal"

  # engine: Storage backend
  #   btree   = B-Tree (default, best for general use)
  #   lsm     = Log-Structured Merge (best for write-heavy)
  #   memory  = Pure in-memory (data lost on restart!)
  engine: btree

  # cache_size_mb: RAM cache for frequently accessed data
  # Set to 0 for auto (uses 50% of available RAM)
  cache_size_mb: 0

  # max_cache_size_mb: Hard limit on cache size
  max_cache_size_mb: 0

  # journaling: Write-ahead logging for durability
  journaling:
    enabled: true
    # sync_interval_ms: How often to sync journal to disk
    sync_interval_ms: 100
    # max_journal_size_mb: Rotate journal when it reaches this size
    max_journal_size_mb: 100

  # compression: Compress data on disk
  compression:
    enabled: true
    # algorithm: snappy | lz4 | zstd | none
    algorithm: snappy
    # compress_indexes: Also compress indexes
    compress_indexes: true

  # Checksum verification on read
  checksum_verification: true

  # Disk space alerts
  disk_usage:
    warning_threshold_percent: 80
    critical_threshold_percent: 90
    # max_db_size_gb: 0 = unlimited
    max_db_size_gb: 0


# =============================================================================
# LOGGING - Where and how logs are written
# =============================================================================
# Hot-reloadable: Yes (sighup signal)

logging:
  # destination: file | syslog | console | none
  destination: file
  log_file: "/var/log/vedadb/vedadb.log"
  # log_level: debug | info | warn | error | fatal
  level: info

  # log_format: text | json
  format: text

  # log_rotation: Enable automatic log rotation
  rotation:
    enabled: true
    # max_size_mb: Rotate when log file reaches this size
    max_size_mb: 100
    # max_files: Keep this many rotated log files
    max_files: 10
    # max_age_days: Delete logs older than this
    max_age_days: 30

  # Component-specific log levels (override global level)
  components:
    # Set to debug for troubleshooting
    query: info
    storage: info
    network: warn
    security: info
    cluster: info
    replication: info
    sharding: info
    vector: info
    graph: info
    cache: info
    ai: info

  # Slow query logging
  slow_queries:
    enabled: true
    # Log queries taking longer than this (ms)
    threshold_ms: 100
    # max_slow_queries_per_minute: Rate limit slow query logging
    max_slow_queries_per_minute: 100

  # Audit logging (security events)
  audit:
    enabled: false
    log_file: "/var/log/vedadb/audit.log"
    # events: List of events to log
    events:
      - "authentication"
      - "authorization"
      - "data_modification"
      - "configuration_change"


# =============================================================================
# PERFORMANCE - Query optimization and resource limits
# =============================================================================
# Hot-reloadable: Yes

performance:
  # worker_threads: Number of worker threads (0 = auto = CPU cores * 2)
  worker_threads: 0

  # max_query_time_ms: Kill queries running longer than this
  max_query_time_ms: 30000

  # max_query_memory_mb: Kill queries using more than this RAM
  max_query_memory_mb: 1024

  # connection_pool:
  #   min: Minimum connections to keep open
  #   max: Maximum connections in pool
  connection_pool:
    min: 10
    max: 100

  # query_optimizer:
  query_optimizer:
    enabled: true
    # max_plan_evaluations: How many query plans to evaluate
    max_plan_evaluations: 100
    # enable_query_caching: Cache query plans
    enable_query_caching: true

  # background tasks
  background_tasks:
    # vacuum_interval_hours: How often to run cleanup/VACUUM
    vacuum_interval_hours: 24
    # index_maintenance_interval_hours: How often to rebuild indexes
    index_maintenance_interval_hours: 168
    # stats_collection_interval_minutes: How often to collect statistics
    stats_collection_interval_minutes: 60

  # resource_governance:
  resource_governance:
    enabled: true
    # max_cpu_percent: Max CPU VedaDB can use (0 = unlimited)
    max_cpu_percent: 0
    # max_memory_mb: Max RAM VedaDB can use (0 = unlimited)
    max_memory_mb: 0
    # io_priority: high | normal | low
    io_priority: normal


# =============================================================================
# BACKUP & RECOVERY - Data protection
# =============================================================================
# Hot-reloadable: Yes

backup:
  # enabled: Enable automatic backups
  enabled: false

  # schedule: Cron expression for backup timing
  #   "0 2 * * *" = Daily at 2 AM
  #   "0 */6 * * *" = Every 6 hours
  schedule: "0 2 * * *"

  # destination: Where to store backups
  destination: "/var/backups/vedadb"

  # retention: How many backups to keep
  retention_count: 7
  retention_days: 30

  # compression: Backup compression
  compression: true
  compression_level: 6

  # encryption: Encrypt backups
  encryption:
    enabled: false
    # algorithm: aes-256-gcm
    key_file: "/etc/vedadb/backup_key"

  # snapshot: Use filesystem snapshots (if supported)
  snapshot:
    enabled: false
    # filesystem: lvm | zfs | btrfs
    filesystem: lvm

  # remote_backup: Sync backups to remote storage
  remote:
    enabled: false
    # provider: s3 | gcs | azure | sftp
    provider: s3
    bucket: "vedadb-backups"
    region: "us-east-1"
    access_key: ""
    secret_key: ""


# =============================================================================
# MONITORING - Metrics and health checks
# =============================================================================
# Hot-reloadable: Yes

monitoring:
  # metrics_endpoint: HTTP endpoint for Prometheus scraping
  metrics:
    enabled: true
    port: 9090
    path: "/metrics"

  # health_check: HTTP health check endpoint
  health_check:
    enabled: true
    port: 8080
    path: "/health"

  # telemetry: Send anonymous usage statistics
  telemetry:
    enabled: false
    # endpoint: Where to send telemetry
    endpoint: "https://telemetry.vedadb.io/v1/report"
    # interval_hours: How often to send
    interval_hours: 24

  # alert thresholds
  alerts:
    # cpu_threshold_percent: Alert if CPU usage exceeds this
    cpu_threshold_percent: 80
    # memory_threshold_percent: Alert if memory usage exceeds this
    memory_threshold_percent: 85
    # disk_threshold_percent: Alert if disk usage exceeds this
    disk_threshold_percent: 80
    # slow_query_alert: Alert on slow queries
    slow_query_alert: true


# =============================================================================
# AI/ML INTEGRATION - GenAI features (optional)
# =============================================================================
# Enable if you want to use VedaDB's built-in AI features.
# Requires external AI API keys.

ai:
  # enabled: Enable AI/ML integration
  enabled: false

  # rag (Retrieval-Augmented Generation)
  rag:
    enabled: false
    # default_embedding_model: Model for vectorizing documents
    default_embedding_model: "text-embedding-3-small"
    # max_context_tokens: Max tokens to send to LLM
    max_context_tokens: 4000

  # llm_providers: Configure LLM API connections
  llm_providers:
    openai:
      enabled: false
      api_key: ""
      base_url: "https://api.openai.com/v1"
      default_model: "gpt-4o"
    anthropic:
      enabled: false
      api_key: ""
      base_url: "https://api.anthropic.com/v1"
      default_model: "claude-sonnet-4-20250514"
    gemini:
      enabled: false
      api_key: ""
      base_url: "https://generativelanguage.googleapis.com/v1beta"
      default_model: "gemini-2.0-flash"
    kimi:
      enabled: false
      api_key: ""
      base_url: "https://api.moonshot.cn/v1"
      default_model: "kimi-k2"

  # query_assistant: Natural language to query translation
  query_assistant:
    enabled: false
    # provider: Which LLM to use for query translation
    provider: "openai"


# =============================================================================
# DEVELOPER - Development and debugging settings
# =============================================================================
# WARNING: These should be disabled in production!

developer:
  # debug_mode: Enable verbose debugging output
  debug_mode: false

  # allow_drop_database: Allow DROP DATABASE command
  allow_drop_database: false

  # allow_explain: Allow EXPLAIN to show query plans
  allow_explain: true

  # profiling: Enable query profiling
  profiling:
    enabled: false
    # profile_all_queries: Profile all queries (not just slow ones)
    profile_all_queries: false
    # slow_query_ms: Threshold for profiling
    slow_query_ms: 100

  # test_endpoints: Enable test/debug HTTP endpoints
  test_endpoints: false

  # mock_data: Generate sample data for testing
  mock_data: false
